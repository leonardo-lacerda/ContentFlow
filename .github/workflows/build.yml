---
name: Build

on:
  push:
    # deploy-digitalocean.yml already runs its own build+test gate (selective,
    # only affected services) before deploying every push to main, so running
    # this workflow's unconditional full-repo build+test there too was pure
    # duplicated GitHub-hosted Actions minutes on every main push. Still runs
    # on any other branch and on pull_request/merge_group below, which is
    # where the full, unconditional build+test actually earns its keep (no
    # deploy gate exists yet to have already covered it).
    branches-ignore:
      - main
  merge_group:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    

    strategy:
      matrix:
        node-version: ['22.12.0']
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test
