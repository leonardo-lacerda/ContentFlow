name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main
    paths:
      - 'apps/backend/**'
      - 'apps/orchestrator/**'
      - 'libraries/**'
      - 'Dockerfile.backend'
      - 'Dockerfile.dev'
      - 'docker-compose*.yaml'
      - 'var/docker/**'
      - '.github/workflows/deploy-digitalocean.yml'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/contentflow

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -f Dockerfile.dev \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Push image to GHCR
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy on Droplet
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy config files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_PORT || '22' }}
          source: "docker-compose.yaml,docker-compose.production.yaml,docker-compose.proxy.yaml,var/docker/caddy/Caddyfile,dynamicconfig/"
          target: ${{ secrets.DO_APP_DIR }}
          rm: false
          strip_components: 0

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_PORT || '22' }}
          command_timeout: 45m
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            set -e
            cd "${{ secrets.DO_APP_DIR }}"

            if [ ! -f .env ]; then
              echo "ERRO: .env nao encontrado em ${{ secrets.DO_APP_DIR }}"
              exit 1
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            COMPOSE_FILES="-f docker-compose.yaml -f docker-compose.production.yaml -f docker-compose.proxy.yaml"

            docker compose $COMPOSE_FILES pull
            docker compose $COMPOSE_FILES up -d
            docker image prune -af
