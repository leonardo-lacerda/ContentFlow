name: Deploy Production Selectively

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  changes:
    name: Detect affected services
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
      deploy: ${{ steps.detect.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: detect
        name: Classify changed files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          if [[ "$before" =~ ^0+$ ]] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            before="${{ github.sha }}^"
          fi
          git diff --name-only "$before" "${{ github.sha }}" > /tmp/changed-files
          cat /tmp/changed-files

          backend=false
          frontend=false
          if grep -Eq '^(apps/backend/|scripts/swc-compile-backend\.js$)' /tmp/changed-files; then backend=true; fi
          if grep -Eq '^(apps/frontend/|scripts/ensure-next-external-aliases\.mjs$)' /tmp/changed-files; then frontend=true; fi
          if grep -Eq '^(libraries/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|tsconfig.*\.json$|ecosystem\.config\.js$|scripts/validate-runtime-env\.mjs$|scripts/deploy/|\.github/workflows/deploy-digitalocean\.yml$)' /tmp/changed-files; then
            backend=true
            frontend=true
          fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          if [[ "$backend" == true || "$frontend" == true ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Build and test affected services
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: pnpm install --frozen-lockfile

      - name: Test backend changes
        if: needs.changes.outputs.backend == 'true'
        run: |
          pnpm exec jest --config apps/backend/jest.config.ts --runInBand \
            libraries/nestjs-libraries/src/throttler/throttler.provider.spec.ts \
            libraries/nestjs-libraries/src/creative-engine/providers/kie/kie-api.client.spec.ts

      - name: Build backend
        if: needs.changes.outputs.backend == 'true'
        run: node scripts/swc-compile-backend.js

      - name: Build frontend
        if: needs.changes.outputs.frontend == 'true'
        run: pnpm --filter contentflow-frontend run build

  deploy:
    name: Deploy only affected services
    needs: [changes, verify]
    if: needs.changes.outputs.deploy == 'true' && needs.verify.result == 'success'
    runs-on: [self-hosted, linux, x64, contentflow-prod]
    permissions:
      contents: read
    steps:
      - name: Create exact release and deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          DEPLOY_BACKEND: ${{ needs.changes.outputs.backend }}
          DEPLOY_FRONTEND: ${{ needs.changes.outputs.frontend }}
        shell: bash
        run: |
          set -Eeuo pipefail
          repo_dir=/opt/contentflow-repository.git
          release_dir="/opt/contentflow-release-${RELEASE_SHA:0:7}"
          auth_header="AUTHORIZATION: bearer $GH_TOKEN"

          if [[ ! -d "$repo_dir" ]]; then
            git -c http.extraHeader="$auth_header" clone --bare \
              "https://github.com/$REPOSITORY.git" "$repo_dir"
          fi
          git --git-dir="$repo_dir" -c http.extraHeader="$auth_header" fetch origin "$RELEASE_SHA"

          if [[ ! -d "$release_dir" ]]; then
            git --git-dir="$repo_dir" worktree add --detach "$release_dir" "$RELEASE_SHA"
          fi

          chmod +x "$release_dir/scripts/deploy/selective-production.sh"
          GITHUB_SHA="$RELEASE_SHA" \
          DEPLOY_BACKEND="$DEPLOY_BACKEND" \
          DEPLOY_FRONTEND="$DEPLOY_FRONTEND" \
            "$release_dir/scripts/deploy/selective-production.sh" "$release_dir"

      - name: External smoke test
        run: |
          curl --fail --show-error --max-time 20 "http://${{ secrets.DO_HOST }}:4007/" >/dev/null
          curl --fail --show-error --max-time 20 "http://${{ secrets.DO_HOST }}:4007/auth/login" >/dev/null
