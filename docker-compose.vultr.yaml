# Docker Compose Vultr - ContentFlow sem Temporal
# Uso: docker compose -f docker-compose.vultr.yaml up -d --build

services:
  contentflow:
    build:
      context: .
      dockerfile: Dockerfile.vultr
      args:
        NEXT_PUBLIC_VERSION: "1.47.0"
    image: contentflow:vultr
    container_name: contentflow
    restart: always
    ports:
      - "4007:5000"
    environment:
      MAIN_URL: '${MAIN_URL:-http://localhost:4007}'
      FRONTEND_URL: '${FRONTEND_URL:-http://localhost:4007}'
      NEXT_PUBLIC_BACKEND_URL: '${NEXT_PUBLIC_BACKEND_URL:-http://localhost:4007/api}'
      JWT_SECRET: '${JWT_SECRET}'
      DATABASE_URL: 'postgresql://contentflow-user:contentflow-password@contentflow-postgres:5432/contentflow-db'
      REDIS_URL: 'redis://contentflow-redis:6379'
      BACKEND_INTERNAL_URL: 'http://localhost:3000'
      TEMPORAL_ADDRESS: ''
      DISABLE_TEMPORAL: 'true'
      IS_GENERAL: 'true'
      DISABLE_REGISTRATION: '${DISABLE_REGISTRATION:-false}'
      STORAGE_PROVIDER: 'local'
      UPLOAD_DIRECTORY: '/uploads'
      NEXT_PUBLIC_UPLOAD_DIRECTORY: '/uploads'
      OPENAI_API_KEY: '${OPENAI_API_KEY:-}'
      AI_PRIMARY_PROVIDER: '${AI_PRIMARY_PROVIDER:-kie}'
      KIEAI_API_KEY: '${KIEAI_API_KEY:-}'
      KIEAI_CHAT_MODEL: '${KIEAI_CHAT_MODEL:-gpt-5-2}'
      KIEAI_CHAT_BASE_URL: '${KIEAI_CHAT_BASE_URL:-}'
      CREATIVE_KIE_ENABLED: '${CREATIVE_KIE_ENABLED:-true}'
      CREATIVE_KIE_BASE_URL: '${CREATIVE_KIE_BASE_URL:-https://api.kie.ai}'
      CREATIVE_KIE_IMAGE_MODEL: '${CREATIVE_KIE_IMAGE_MODEL:-gpt-image-1}'
      CREATIVE_KIE_VIDEO_MODEL: '${CREATIVE_KIE_VIDEO_MODEL:-seedance-2.5}'
      CREATIVE_KIE_BROLL_MODEL: '${CREATIVE_KIE_BROLL_MODEL:-seedance-2.5}'
      CREATIVE_KIE_SEEDANCE_MODEL: '${CREATIVE_KIE_SEEDANCE_MODEL:-seedance-2.5}'
      CREATIVE_KIE_SEEDANCE_RESOLUTION: '${CREATIVE_KIE_SEEDANCE_RESOLUTION:-720p}'
      CREATIVE_KIE_TTS_MODEL: '${CREATIVE_KIE_TTS_MODEL:-elevenlabs/text-to-speech-multilingual-v2}'
      CREATIVE_KIE_TALKING_ACTOR_MODEL: '${CREATIVE_KIE_TALKING_ACTOR_MODEL:-kling/ai-avatar-standard}'
      CREATIVE_KIE_LIP_SYNC_MODEL: '${CREATIVE_KIE_LIP_SYNC_MODEL:-kling/ai-avatar-standard}'
      CREATIVE_KIE_IMAGE_ENDPOINT: '${CREATIVE_KIE_IMAGE_ENDPOINT:-/api/v1/jobs/createTask}'
      CREATIVE_KIE_CALLBACK_URL: '${CREATIVE_KIE_CALLBACK_URL:-}'
      CREATIVE_KIE_WEBHOOK_SECRET: '${CREATIVE_KIE_WEBHOOK_SECRET:-}'
      CREATIVE_KIE_POLL_INTERVAL_MS: '${CREATIVE_KIE_POLL_INTERVAL_MS:-5000}'
      CREATIVE_KIE_MAX_POLL_ATTEMPTS: '${CREATIVE_KIE_MAX_POLL_ATTEMPTS:-180}'
      BILLING_CREDITS_V2: '${BILLING_CREDITS_V2:-true}'
      BILLING_PROVIDER: '${BILLING_PROVIDER:-stripe}'
      BILLING_FREE_CREDITS: '${BILLING_FREE_CREDITS:-200}'
      BILLING_USD_BRL: '${BILLING_USD_BRL:-5.50}'
      AI_GENERATE_BASE_URL: '${AI_GENERATE_BASE_URL:-http://localhost:3000}'
      AI_GENERATE_API_KEY: '${AI_GENERATE_API_KEY:-contentflow-ai-key}'
      AI_GENERATE_OPENAI_API_KEY: '${AI_GENERATE_OPENAI_API_KEY:-}'
      AI_GENERATE_OPENAI_BASE_URL: '${AI_GENERATE_OPENAI_BASE_URL:-https://api.openai.com}'
      AI_GENERATE_OPENAI_IMAGE_MODEL: '${AI_GENERATE_OPENAI_IMAGE_MODEL:-gpt-image-2}'
      API_LIMIT: '${API_LIMIT:-30}'
      NX_ADD_PLUGINS: 'false'
      NODE_ENV: 'production'
    volumes:
      - contentflow-uploads:/uploads
    depends_on:
      contentflow-postgres:
        condition: service_healthy
      contentflow-redis:
        condition: service_started
    networks:
      - contentflow-network

  contentflow-postgres:
    image: postgres:16-alpine
    container_name: contentflow-postgres
    restart: always
    environment:
      POSTGRES_USER: contentflow-user
      POSTGRES_PASSWORD: contentflow-password
      POSTGRES_DB: contentflow-db
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contentflow-user -d contentflow-db"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - contentflow-network

  contentflow-redis:
    image: redis:7-alpine
    container_name: contentflow-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - contentflow-redis-data:/data
    networks:
      - contentflow-network

volumes:
  postgres-volume:
  contentflow-redis-data:
  contentflow-uploads:

networks:
  contentflow-network:
    driver: bridge
